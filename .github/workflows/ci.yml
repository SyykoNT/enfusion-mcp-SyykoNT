name: CI

on:
  push:
    branches: [syyko/dev]
  pull_request:
    branches: [syyko/dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: node scripts/build-info.mjs && npx tsc -p tsconfig.build.json

      - run: npx vitest run
