name: CI

on:
  push:
    branches: [syyko/dev]
  pull_request:
    branches: [syyko/dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Two steps, not one line with &&: Windows PowerShell 5.1 has no &&.
      - run: node scripts/build-info.mjs

      - run: npx tsc -p tsconfig.build.json

      - run: npx vitest run
